# Weekly dependency updates across all ecosystems used in Ranzlappen repos.
# Trim to the package-ecosystem entries that actually apply to a given repo.
#
# v2 expectations applied across every entry:
#   - explicit `open-pull-requests-limit` (cap PR queue depth).
#   - `labels` for triage (`dependencies` + ecosystem tag).
#   - `commit-message` with conventional-commits prefixes:
#       prod    → "chore(deps)"
#       dev     → "chore(deps-dev)"
#       include "scope" so the package name lands in the commit subject.
#   - groups split prod vs dev (where the ecosystem distinguishes the two);
#     minor + patch are grouped, majors land one-per-PR for individual review.

version: 2
updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions used in workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # npm — root (split prod vs dev)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      npm-prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # npm — sub-app example (uncomment and adjust the directory per repo)
  # ---------------------------------------------------------------------------
  # - package-ecosystem: "npm"
  #   directory: "/path/to/subapp"
  #   schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 10
  #   labels:
  #     - "dependencies"
  #     - "npm"
  #     - "subapp"
  #   commit-message:
  #     prefix: "chore(deps)"
  #     prefix-development: "chore(deps-dev)"
  #     include: "scope"
  #   groups:
  #     subapp-prod-minor-patch:
  #       dependency-type: "production"
  #       update-types: ["minor", "patch"]
  #     subapp-dev-minor-patch:
  #       dependency-type: "development"
  #       update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Python (pip)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      pip-prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      pip-dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Ruby (Bundler) — for Jekyll projects
  # ---------------------------------------------------------------------------
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      bundler-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # Gradle — for Android / Kotlin projects
  # ---------------------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
