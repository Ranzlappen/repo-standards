# Validation checks for static HTML projects.
#
# Static HTML projects don't have a "build" — these checks catch broken HTML,
# broken links, and accidentally-committed secrets. Cheap insurance for hobby
# projects deployed to GitHub Pages.
#
# Adapt:
#  - Drop link checking if the project has lots of intentional placeholder hrefs.
#  - Add Lighthouse CI later if performance budgets matter.

name: CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'

      - name: HTML validation
        run: |
          npx --yes html-validate "**/*.html" --formatter stylish

      - name: Check internal links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2
        with:
          args: --offline --verbose --no-progress './**/*.html' './**/*.md'
          fail: true

      - name: Basic secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
