# jobs:
#   lint-test:
#     uses: ./.github/workflows/lint-and-test.yml
#     with: { language: node }
#   summarize:
#     needs: [lint-test]
#     if: ${{ always() }}
#     uses: ./.github/workflows/workflow-summary.yml
#     with:
#       workflow-name: CI
#       post-pr-comment: true
#     permissions:
#       contents: read
#       actions: read
#       pull-requests: write
#       checks: read
