# Reusable lint + test workflow.
#
# Call from a per-repo workflow with:
#
#   jobs:
#     lint-test:
#       uses: <OWNER>/<REPO>/.github/workflows/lint-and-test.yml@<SHA>
#       with:
#         language: node           # or: python | static-html | mixed
#         working-directory: .     # path to the project root if not repo root
#         node-version: '22'       # ignored unless language ~ node
#         python-version: '3.12'   # ignored unless language ~ python
#         lint-command: ''         # override default lint command per language
#         test-command: ''         # override default test command per language
#
# This is one workflow with a `language` input rather than separate per-stack
# files because the wiring (checkout, setup, cache, run) is identical and the
# differences are localized to two commands.

name: Lint and test

on:
  workflow_call:
    inputs:
      language:
        description: 'node | python | static-html | mixed'
        required: true
        type: string
      working-directory:
        description: 'Path to project root within the repo'
        required: false
        type: string
        default: '.'
      node-version:
        description: 'Node.js version (used when language ~ node|mixed)'
        required: false
        type: string
        default: '22'
      python-version:
        description: 'Python version (used when language ~ python|mixed)'
        required: false
        type: string
        default: '3.12'
      lint-command:
        description: 'Custom lint command. If empty, the default for the language runs.'
        required: false
        type: string
        default: ''
      test-command:
        description: 'Custom test command. If empty, the default for the language runs.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Setup Node.js
        if: inputs.language == 'node' || inputs.language == 'mixed' || inputs.language == 'static-html'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Setup Python
        if: inputs.language == 'python' || inputs.language == 'mixed'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install (Node)
        if: inputs.language == 'node' || inputs.language == 'mixed'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Install (Python)
        if: inputs.language == 'python' || inputs.language == 'mixed'
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.lint-command }}" ]; then
            ${{ inputs.lint-command }}
          else
            case "${{ inputs.language }}" in
              node|mixed)
                npm run lint
                ;;
              python)
                ruff check .
                ;;
              static-html)
                npx --yes html-validate "**/*.html" --formatter stylish
                ;;
            esac
          fi

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.test-command }}" ]; then
            ${{ inputs.test-command }}
          else
            case "${{ inputs.language }}" in
              node|mixed)
                npm test
                ;;
              python)
                pytest -q
                ;;
              static-html)
                echo "No tests for static-html projects; skipping."
                ;;
            esac
          fi

# Optional consumer wiring (paste into the per-repo workflow that calls
# this one). Adds an AI-parsable Markdown summary to $GITHUB_STEP_SUMMARY
# and an updateable PR comment. `if: ${{ always() }}` ensures the summary
# runs even when lint or test failed — without it, the PR comment never
# refreshes with the failure detail.
