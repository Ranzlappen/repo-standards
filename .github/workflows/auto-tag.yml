name: Auto-tag on VERSION change

# Watches main for VERSION-file changes. When VERSION bumps and no matching
# tag exists, creates an annotated tag `vX.Y.Z` at the merge commit and
# (for non-prerelease versions) force-updates the moving major-version
# pointer (e.g. `v2`).
#
# Once a new tag is created, the downstream `build` and `release` jobs
# publish a signed GitHub Release containing a tarball of the standards
# toolkit plus a Sigstore bundle that attests SLSA build provenance.
# The attestation is generated by `actions/attest-build-provenance`
# (keyless OIDC signing via Sigstore Fulcio, transparency log: Rekor).
# This satisfies OpenSSF Scorecard's Packaging and Signed-Releases checks.
#
# Pre-release versions (anything containing a hyphen, e.g. 2.0.0-rc.1):
#   - Tag the exact version (vX.Y.Z-suffix).
#   - DO NOT move the major-version pointer.
#   - DO publish a signed Release marked as prerelease.
#
# Manual / retroactive tagging stays in tag-release.yml. Retroactive tags
# do NOT currently get release artifacts; that is a follow-up.

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Job-scoped write — needed for `git tag` + `git push origin <tag>` +
      # the force-update of the moving major-version pointer below. Workflow
      # scope stays `contents: read` so OpenSSF Scorecard's Token-Permissions
      # check sees least-privilege at the workflow level.
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      created: ${{ steps.created.outputs.created }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: ver
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$V" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          MAJOR="v$(echo "$V" | cut -d. -f1)"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          if [[ "$V" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate semver
        run: |
          python3 -c "import re,sys; v='${{ steps.ver.outputs.version }}'; \
            assert re.match(r'^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$', v), \
            f'VERSION not semver: {v}'; print('semver ok:', v)"

      - name: Check whether tag already exists
        id: check
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.ver.outputs.tag }} already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create annotated tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag -a "${{ steps.ver.outputs.tag }}" \
            -m "Release ${{ steps.ver.outputs.tag }}" \
            "${{ github.sha }}"

      - name: Push exact-version tag
        if: steps.check.outputs.exists == 'false'
        run: git push origin "${{ steps.ver.outputs.tag }}"

      - name: Update moving major-version pointer
        if: steps.check.outputs.exists == 'false' && steps.ver.outputs.prerelease == 'false'
        run: |
          git tag -fa "${{ steps.ver.outputs.major }}" \
            -m "${{ steps.ver.outputs.major }} -> ${{ steps.ver.outputs.tag }}" \
            "${{ github.sha }}"
          git push --force origin "${{ steps.ver.outputs.major }}"

      - name: Skipped major pointer (prerelease)
        if: steps.check.outputs.exists == 'false' && steps.ver.outputs.prerelease == 'true'
        run: echo "Skipped moving ${{ steps.ver.outputs.major }} for prerelease ${{ steps.ver.outputs.tag }}"

      - name: Record whether a new tag was created this run
        id: created
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "false" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build release tarball
    needs: auto-tag
    if: needs.auto-tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Read-only — only fetches the freshly-created tag and packs source.
      contents: read
    outputs:
      tarball-name: ${{ steps.pack.outputs.tarball-name }}
    steps:
      - name: Checkout at the new tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ needs.auto-tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build reproducible tarball
        id: pack
        env:
          TAG: ${{ needs.auto-tag.outputs.tag }}
        run: |
          set -euo pipefail
          NAME="repo-standards-templates-${TAG}.tar.gz"
          # Curated payload: the standards toolkit a downstream consumer
          # would pin to. Excludes .git, .github (meta-CI), the dogfood
          # marker file, and SPONSORS.md (this-repo-only).
          tar --owner=0 --group=0 --numeric-owner --sort=name \
              --mtime="1970-01-01 00:00:00 UTC" \
              -czf "${NAME}" \
              templates/ \
              prompt/ \
              scripts/ \
              docs/ \
              LICENSE \
              README.md \
              CHANGELOG.md \
              VERSION \
              PROMPT.md \
              UPGRADE_CHECKLIST.md \
              REFACTORING_GUIDE.md
          sha256sum "${NAME}" | tee "${NAME}.sha256"
          echo "tarball-name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload tarball + checksum as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-payload
          path: |
            ${{ steps.pack.outputs.tarball-name }}
            ${{ steps.pack.outputs.tarball-name }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish signed GitHub Release
    needs: [auto-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # `contents: write`     — softprops/action-gh-release creates the Release
      #                         and uploads assets via the Releases API.
      # `id-token: write`     — OIDC handshake with Sigstore Fulcio for the
      #                         build-provenance attestation (keyless signing).
      # `attestations: write` — store the attestation against the repo via
      #                         GitHub's attestations API (queryable with
      #                         `gh attestation verify`).
      # Workflow scope remains `contents: read` so Token-Permissions
      # stays at 10/10.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-payload

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: ${{ needs.build.outputs.tarball-name }}

      - name: Stage attestation bundle as a release asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          NAME: ${{ needs.build.outputs.tarball-name }}
        run: |
          set -euo pipefail
          # actions/attest-build-provenance writes the Sigstore bundle to a
          # temp file. Copy it next to the tarball under a stable name so the
          # release-upload step can attach it. The `.sigstore` substring is
          # what OpenSSF Scorecard's Signed-Releases check matches on.
          cp "${BUNDLE}" "${NAME}.sigstore.json"

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ needs.auto-tag.outputs.tag }}
          name: ${{ needs.auto-tag.outputs.tag }}
          prerelease: ${{ needs.auto-tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ needs.build.outputs.tarball-name }}
            ${{ needs.build.outputs.tarball-name }}.sha256
            ${{ needs.build.outputs.tarball-name }}.sigstore.json
