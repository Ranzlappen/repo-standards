name: Self-validate standards

# Validates the standards repo's own contents on every PR or push that
# touches docs / templates / workflows / VERSION / CHANGELOG.
#
# Checks:
#   - actionlint on every YAML in templates/.github/workflows/ and on this repo's
#     own .github/workflows/.
#   - lychee --offline on every Markdown file (no broken internal links).
#   - VERSION parses as semver.
#   - SHA-pinning lint on `uses:` lines: hard fail if any `uses:` is not
#     pinned to a 40-char SHA. Major-version pins like @v6 are rejected.

on:
  pull_request:
    paths:
      - 'templates/**'
      - '.github/workflows/**'
      - 'PROMPT.md'
      - 'UPGRADE_CHECKLIST.md'
      - 'REFACTORING_GUIDE.md'
      - 'README.md'
      - 'VERSION'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - '.github/workflows/**'
      - 'PROMPT.md'
      - 'UPGRADE_CHECKLIST.md'
      - 'REFACTORING_GUIDE.md'
      - 'README.md'
      - 'VERSION'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-yaml:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8  # v2
        with:
          files: |
            .github/workflows/*.yml
            templates/.github/workflows/*.yml

  validate-markdown-links:
    name: lychee (offline link check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Lychee link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2
        with:
          # Skip templates/: those files use relative paths that are
          # intentionally consumer-repo-relative (`../../issues`,
          # `../CLAUDE.md`, etc.) and resolve correctly only when the
          # template has been copied into a real repo. Consumer repos
          # check their own links via their own CI.
          args: --offline --no-progress --include-fragments --exclude-path templates './**/*.md'
          fail: true

  validate-version:
    name: VERSION is semver
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Assert VERSION matches SemVer
        run: |
          VERSION_STR="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$VERSION_STR"
          python3 -c "import re,sys; v='${VERSION_STR}'; \
            assert re.match(r'^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$', v), f'not semver: {v}'; \
            print('semver ok:', v)"

  validate-sha-pinning:
    name: uses-line SHA-pinning lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Scan workflow uses for non-SHA refs
        run: |
          set -e
          shopt -s globstar nullglob
          FAIL=0
          for f in .github/workflows/*.yml templates/.github/workflows/*.yml; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              ref="${line##*@}"
              # Hard fail if not a 40-char hex SHA. v2 enforces SHA pinning
              # for every `uses:` line; major-version pins like @v6 are no
              # longer accepted (use SHA + comment for major version).
              if ! echo "$ref" | grep -Eq '^[0-9a-f]{40}([[:space:]]|$)'; then
                echo "::error file=$f::uses pin is not a 40-char SHA: $line"
                FAIL=1
              fi
            done < <(grep -nE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+[^[:space:]]+@[^[:space:]]+' "$f" || true)
          done
          exit $FAIL

  validate-workflow-properties:
    name: workflow properties.json pairing
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Assert every workflow has a properties.json sidecar
        # v2.1 ships a `*.properties.json` per workflow template (name,
        # description, iconName, categories, filePatterns) so internal
        # catalogs and AI agents can consume the same schema as
        # github/starter-workflows. This job hard-fails if any new
        # workflow lands without its sidecar, or if a sidecar is invalid
        # JSON.
        run: |
          set -e
          shopt -s nullglob
          FAIL=0
          for wf in templates/.github/workflows/*.yml; do
            [ -f "$wf" ] || continue
            base="${wf%.yml}"
            sidecar="${base}.properties.json"
            if [ ! -f "$sidecar" ]; then
              echo "::error file=$wf::missing companion ${sidecar} (v2.1 requires every workflow template to ship a properties.json sidecar)"
              FAIL=1
              continue
            fi
            if ! python3 -m json.tool < "$sidecar" >/dev/null 2>&1; then
              echo "::error file=$sidecar::properties.json does not parse as JSON"
              FAIL=1
            fi
          done
          # Also catch orphan sidecars (sidecar without workflow).
          for sc in templates/.github/workflows/*.properties.json; do
            [ -f "$sc" ] || continue
            base="${sc%.properties.json}"
            wf="${base}.yml"
            if [ ! -f "$wf" ]; then
              echo "::error file=$sc::orphan properties.json — no matching ${wf}"
              FAIL=1
            fi
          done
          exit $FAIL

  summarize:
    name: Workflow summary
    needs: [validate-yaml, validate-markdown-links, validate-version, validate-sha-pinning, validate-workflow-properties]
    if: ${{ always() }}
    uses: ./.github/workflows/workflow-summary.yml
    with:
      workflow-name: Self-validate
      post-pr-comment: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: read
